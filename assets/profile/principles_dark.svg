<svg xmlns="http://www.w3.org/2000/svg" width="620" height="196" viewBox="0 0 620 196" role="img" aria-label="How I work: evidence first, every result links to its data, scripts or tests; report failures, negative results are documented with the next fix; guardrails, validation, artifact checks, CI, accessibility and security scans."><title>How I work</title><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.mobile{display:none}@media(max-width:480px){.desktop{display:none}.mobile{display:inline}}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes rise{from{transform:translateY(5px)}to{transform:none}}@keyframes pulse{0%{r:4;opacity:.9}70%{r:10;opacity:0}100%{r:10;opacity:0}}@keyframes cursor{50%{opacity:0}}.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) .3s both}.tick{animation:rise .45s ease-out both}.pulse{animation:pulse 2s ease-out infinite}.cursor{animation:cursor 1.2s steps(1,end) infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse{opacity:0}}</style><rect x="1" y="1" width="618" height="194" rx="10" fill="#0d151d" stroke="#36545d"/><path d="M20 43H600" stroke="#35545d"/><text x="22" y="30" fill="#83ded4" font-size="16" font-weight="700">&gt;</text><text x="43" y="30" fill="#f3f0e7" font-size="15" font-weight="700">HOW I WORK</text><g class="desktop"><g class="tick" style="animation-delay:0.15s"><text x="24" y="74" fill="#edb56e" font-size="13" font-weight="700">01</text><text x="24" y="98" fill="#83ded4" font-size="15" font-weight="700">EVIDENCE FIRST</text><text x="24" y="126" fill="#f3f0e7" font-size="14" font-weight="400">Every result links to</text><text x="24" y="147" fill="#f3f0e7" font-size="14" font-weight="400">the data, scripts or</text><text x="24" y="168" fill="#f3f0e7" font-size="14" font-weight="400">tests behind it.</text></g><g class="tick" style="animation-delay:0.35s"><text x="220" y="74" fill="#edb56e" font-size="13" font-weight="700">02</text><text x="220" y="98" fill="#83ded4" font-size="15" font-weight="700">REPORT FAILURES</text><text x="220" y="126" fill="#f3f0e7" font-size="14" font-weight="400">Negative results are</text><text x="220" y="147" fill="#f3f0e7" font-size="14" font-weight="400">documented with the</text><text x="220" y="168" fill="#f3f0e7" font-size="14" font-weight="400">next fix.</text></g><path d="M206 62V176" stroke="#35545d"/><g class="tick" style="animation-delay:0.55s"><text x="416" y="74" fill="#edb56e" font-size="13" font-weight="700">03</text><text x="416" y="98" fill="#83ded4" font-size="15" font-weight="700">GUARDRAILS</text><text x="416" y="126" fill="#f3f0e7" font-size="14" font-weight="400">Validation, artifact</text><text x="416" y="147" fill="#f3f0e7" font-size="14" font-weight="400">checks, CI, a11y and</text><text x="416" y="168" fill="#f3f0e7" font-size="14" font-weight="400">security scans.</text></g><path d="M402 62V176" stroke="#35545d"/></g><g class="mobile"><text x="24" y="82" fill="#edb56e" font-size="18" font-weight="700">01</text><text x="70" y="82" fill="#83ded4" font-size="20" font-weight="700">EVIDENCE FIRST</text><text x="24" y="124" fill="#edb56e" font-size="18" font-weight="700">02</text><text x="70" y="124" fill="#83ded4" font-size="20" font-weight="700">REPORT FAILURES</text><text x="24" y="166" fill="#edb56e" font-size="18" font-weight="700">03</text><text x="70" y="166" fill="#83ded4" font-size="20" font-weight="700">GUARDRAILS</text></g></svg>
